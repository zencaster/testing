<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vercel Deploy Test</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .info-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid #1e293b;
    }
    .info-row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    button {
      width: 100%;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> Online di Vercel</div>
    <h1>Deploy Berhasil!</h1>
    <p>Aplikasi web statis ini sudah aktif di internet dengan HTTPS otomatis.</p>

    <div class="info-box">
      <div class="info-row">
        <span class="label">Domain Aktif</span>
        <span id="host">-</span>
      </div>
      <div class="info-row">
        <span class="label">Waktu Lokal</span>
        <span id="clock">-</span>
      </div>
      <div class="info-row">
        <span class="label">Test Interaksi JS</span>
        <span><strong id="count">0</strong> klik</span>
      </div>
    </div>

    <button id="btn">Klik untuk Tes JavaScript</button>
  </div>

  <script>
    document.getElementById('host').textContent = window.location.hostname || 'localhost';

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID');
    }
    updateClock();
    setInterval(updateClock, 1000);

    let clicks = 0;
    document.getElementById('btn').addEventListener('click', () => {
      clicks++;
      document.getElementById('count').textContent = clicks;
    });
  </script>
</body>
</html>
